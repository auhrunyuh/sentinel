name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Sentinel
        run: dotnet build Sentinel.slnx -c Release

      - name: Test Sentinel
        run: dotnet test Sentinel.slnx -c Release --no-build

      - name: Build sample OrderService
        run: dotnet build samples/OrderService/OrderService.slnx -c Release

      - name: Test sample OrderService
        run: dotnet test samples/OrderService/OrderService.slnx -c Release --no-build
